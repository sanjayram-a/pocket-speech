[project]
name = "pocket-speech-backend"
version = "0.1.0"
description = "FastAPI backend for Pocket Speech"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "firebase-admin>=7,<8",
    "modal>=1.5,<2",
    "pydantic-settings>=2.10,<3",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.12,<3",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pocket_speech"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
filterwarnings = ["error"]
testpaths = ["tests"]
xfail_strict = true

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY001", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "DTZ001", "PLR2004", "S101", "S105"]

[tool.ruff.lint.isort]
known-first-party = ["pocket_speech"]

[tool.ruff.format]
docstring-code-format = true
